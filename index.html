<!DOCTYPE html>
<html> 
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>LakeOS</title>
      <link rel="stylesheet" href="style.css">
  </head>

  <body> 

      <div class="topbar"> 
        LakeOS
        <div class="clock" id="clock"> 00:00 </div>
      </div>


      <div class="icone-geral" onclick="openWindow()" id="weather">
        <div class="icone-img"><img src="pictures/weather.png" height="70" width="70"></div>
        <div class="icone-text">Weather</div>
      </div>


      <div class="icone-geral" onclick="openWindow('window-nts')" id="notes"> 
        <div class="icone-img"><img src="pictures/notes.png" height="70" width="70"></div>
        <div class = "icone-text">Notes</div>
      </div>


        <div class="window-geral drag-zone" id="window-nts">
           <div class="window-title drag-zone">Notes</div>
           <button class="close-button" onclick="closeWindow('window-nts')"> X </button>
           <div class="window-body drag-zone">
           <input type="text" id="textInput" placeholder="write your notes">
           </div>
        </div>



        
      <script src="script.js"></script>
  </body>


</html>
