<!DOCTYPE html>
<html> 
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>LakeOS</title>
      <link rel="stylesheet" href="style.css">
  </head>

  <body> 

      <div class="topbar"> 
        LakeOS
        <div class="clock" id="clock"> 00:00:00 </div>
      </div>


      <div class="icone-geral" onclick="openWindow('window-wth')" id="weather">
        <div class="icone-img"><img src="pictures/weather.png" height="70" width="70"></div>
        <div class="icone-text">Weather</div>
      </div>


      <div class="icone-geral" onclick="openWindow('window-nts')" id="notes"> 
        <div class="icone-img"><img src="pictures/notes.png" height="70" width="70"></div>
        <div class = "icone-text">Notes</div>
      </div>


        <div class="window-geral" id="window-nts">
           <div class="window-title">Notes</div>
           <button class="close-button" onclick="closeWindow('window-nts')"> X </button>
           <div class="window-body">
           <input type="text" id="textInput" placeholder="Write your notes">
           </div>
        </div>

        <div class = "window-geral" id = "window-wth">

          <div class = "window-title"> Weather Search</div>
          <button class="close-button" onclick="closeWindow('window-wth')"> X </button>

          <div class="window-body">
            <input type="text" id="textweather" placeholder="Search a city weather">
            <button class "enter-button" onclick"searchWeather()"> Search </button>
            
            <div class="weather-info">
              <p id="city-name">City Name</p>
              <h2 id="city-weather">-- °C</h2>
            </div>
          </div>
        </div>



        
      <script src="script.js"></script>
  </body>


</html>
