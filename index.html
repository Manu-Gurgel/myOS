<!DOCTYPE html>
<html> 
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>LakeOS</title>
      <link rel="stylesheet" href="style.css">
  </head>

  <body> 

      <div class="topbar"> 
        LakeOS
        <div class="clock" id="clock"> 00:00:00 </div>
      </div>


      <div class="icone-geral" onclick="openWindow('window-wth')" id="weather">
        <div class="icone-img"><img src="pictures/weather.png" height="70" width="70"></div>
        <div class="icone-text">Weather</div>
      </div>


      <div class="icone-geral" onclick="openWindow('window-nts')" id="notes"> 
        <div class="icone-img"><img src="pictures/notes.png" height="70" width="70"></div>
        <div class = "icone-text">Notes</div>
      </div>


        <div class="window-geral" id="window-nts">
           <div class="window-title">Notes</div>
           <button class="close-button" onclick="closeWindow('window-nts')"></button>
           <div class="window-body">
           <textarea class="textInput" placeholder="Write your notes"></textarea>
           </div>
        </div>

        <div class = "window-geral" id = "window-wth">

          <div class = "window-title"> Weather Search</div>
          <button class="close-button" onclick="closeWindow('window-wth')"></button>

          <div class="window-body">
            <textarea class="textInput" id="weather-input" placeholder="Search a city weather"></textarea>
            <button class="enter-button" onclick="searchWeather('weather-input')"> Search </button>
            <br>
            <div class="weather-info">
              <div id="city-name">City Name</div>
              <div id="city-weather">-- °C</div>
            </div>
          </div>
        </div>



        
      <script src="script.js"></script>
  </body>


</html>
